<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f8">
  <title>邮件工作台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="邮件工作台首页"><span class="brand-mark" aria-hidden="true">✉</span><span>邮件工作台</span></a>
    <div class="topbar-status"><span class="status-dot" id="statusDot"></span><span id="statusText">正在连接邮件…</span></div>
    <button class="button button-primary" id="composeButton" type="button"><span aria-hidden="true">＋</span> 写邮件</button>
  </header>

  <div class="workspace">
    <aside class="sidebar" aria-label="邮箱文件夹">
      <div class="sidebar-heading"><span>邮箱</span><button class="icon-button" id="refreshButton" type="button" aria-label="刷新邮箱" title="刷新邮箱">↻</button></div>
      <label class="account-picker"><span>账号</span><select id="accountSelect" aria-label="选择邮箱账号"></select></label>
      <div id="mailboxList" class="mailbox-list"><div class="sidebar-message">正在读取邮箱…</div></div>
      <div class="sidebar-note"><span class="privacy-mark" aria-hidden="true">●</span><span>邮件由 macOS「邮件」应用管理</span></div>
    </aside>

    <main class="main-panel">
      <section class="list-panel" id="listPanel">
        <div class="panel-toolbar">
          <div><h1 id="folderTitle">收件箱</h1><span class="result-count" id="resultCount"></span></div>
          <label class="search-box"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="筛选当前文件夹" aria-label="筛选邮件"></label>
        </div>
        <div class="message-list" id="messageList" aria-live="polite" aria-busy="true"></div>
      </section>
      <section class="detail-panel hidden" id="detailPanel" aria-label="邮件内容">
        <div class="detail-toolbar"><button class="text-button" id="backButton" type="button">← 邮件列表</button><button class="text-button" id="markUnreadButton" type="button">标为未读</button></div>
        <article id="messageDetail" class="message-detail"></article>
      </section>
      <div class="error-toast hidden" id="errorToast" role="alert"><span id="errorText"></span><button id="dismissError" type="button" aria-label="关闭">×</button></div>
    </main>
  </div>

  <dialog id="composeDialog" class="compose-dialog">
    <form id="composeForm" method="dialog">
      <div class="dialog-header"><h2>新邮件</h2><button class="icon-button" id="closeCompose" type="button" aria-label="关闭">×</button></div>
      <label class="compose-field"><span>收件人</span><input name="to" type="text" autocomplete="email" required placeholder="name@example.com，多个地址用逗号分隔"></label>
      <details class="more-recipients"><summary>抄送和密送</summary><label class="compose-field"><span>抄送</span><input name="cc" type="text"></label><label class="compose-field"><span>密送</span><input name="bcc" type="text"></label></details>
      <label class="compose-field"><span>主题</span><input name="subject" type="text"></label>
      <label class="compose-body"><span class="visually-hidden">邮件正文</span><textarea name="body" required placeholder="撰写邮件…"></textarea></label>
      <div class="compose-footer"><span class="compose-status" id="composeStatus" aria-live="polite"></span><button class="button button-primary" id="sendButton" type="submit">发送</button></div>
    </form>
  </dialog>
  <script src="/app.js" defer></script>
</body>
</html>
